<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Bingo - UCL Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        },
                        yellow: {
                            400: '#facc15',
                            500: '#eab308',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f3ff; margin: 0; padding: 0; }
        .font-serif { font-family: 'Georgia', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #ede9fe; border-radius: 4px;}
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c4b5fd; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const CLUES = [
            "Hafiz",
            "Has a sibling at UCL",
            "Been to a Premier League game",
            "Someone that commutes",
            "Been to a different continent this year",
            "Speaks Arabic",
            "Does social media",
            "Can cook a traditional meal from scratch",
            "Doesn't drink coffee or tea",
            "Has a driver's licence",
            "Plays or used to play FIFA like it's a job",
            "Done umrah",
            "Grew up in the Middle East",
            "Has gotten lost on campus",
            "Been to any South Kensington museum",
            "Speaks Urdu",
            "Has been locked out of their accom room already",
            "Is the youngest sibling",
            "Listens to halal beats while studying",
            "Still hasn't unpacked",
            "Brought a console to accom"
        ];
        
        const FREE_SPACE_INDEX = -1;
        const TOTAL_TO_WIN = 21; // 21 boxes now
        const ADMIN_CODE = "ADMIN_UCL_2026"; // The secret code for the admin panel

        // Simulated Local Storage for "Multiplayer" feeling locally
        const getLocalPlayers = () => JSON.parse(localStorage.getItem('bingo_players') || '[]');
        const saveLocalPlayers = (players) => localStorage.setItem('bingo_players', JSON.stringify(players));

        const getGameState = () => JSON.parse(localStorage.getItem('bingo_game_state') || 'false');
        const setGameState = (state) => localStorage.setItem('bingo_game_state', JSON.stringify(state));

        const BingoSquare = ({ index, clue, value, onChange, disabled }) => {
            const isFreeSpace = index === FREE_SPACE_INDEX;
            
            return (
                <div className={`p-3 rounded-xl border-2 flex flex-col justify-between transition-all duration-300 min-h-[140px] shadow-sm 
                    ${isFreeSpace 
                        ? 'bg-yellow-50 border-yellow-400' 
                        : value 
                            ? 'bg-purple-50 border-purple-400 shadow-purple-100' 
                            : 'bg-white border-purple-100 hover:border-purple-300'}`}>
                    
                    <div>
                        <div className="flex justify-between items-start mb-2">
                            <span className={`text-xs font-bold ${isFreeSpace ? 'text-yellow-600' : 'text-purple-400'}`}>
                                {(index + 1).toString().padStart(2, '0')}
                            </span>
                            {isFreeSpace && <span className="text-[10px] font-bold bg-yellow-400 text-yellow-900 px-2 py-0.5 rounded-full">FREE</span>}
                        </div>
                        <p className={`text-sm font-semibold mb-3 ${isFreeSpace ? 'text-yellow-900' : 'text-slate-800'}`}>
                            {clue}
                        </p>
                    </div>

                    {!isFreeSpace ? (
                        <input
                            type="text"
                            placeholder="Tap to add a name"
                            value={value || ''}
                            onChange={(e) => onChange(index, e.target.value)}
                            disabled={disabled}
                            className="w-full bg-transparent border-b border-purple-200 focus:border-purple-500 focus:outline-none text-sm text-purple-900 font-medium py-1 disabled:opacity-50 transition-colors"
                        />
                    ) : (
                        <p className="text-xs text-yellow-700 italic">Counts toward completion</p>
                    )}
                </div>
            );
        };

        const AdminDashboard = ({ players, onLogout, onClearAll, gameStarted, toggleGameState }) => {
            const [expandedPlayerId, setExpandedPlayerId] = React.useState(null);
            const sortedPlayers = [...players].sort((a, b) => b.score - a.score);

            return (
                <div className="min-h-screen bg-purple-50 p-8">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex justify-between items-center mb-8">
                            <h1 className="text-3xl font-black text-purple-900">Admin Dashboard</h1>
                            <div className="flex gap-4">
                                <button 
                                    onClick={toggleGameState} 
                                    className={`px-6 py-2 rounded-lg font-bold text-white shadow-md transition-all ${gameStarted ? 'bg-orange-500 hover:bg-orange-600' : 'bg-green-500 hover:bg-green-600'}`}
                                >
                                    {gameStarted ? 'Stop Game' : 'Start Game'}
                                </button>
                                <button onClick={onClearAll} className="px-4 py-2 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg font-bold">Clear All Data</button>
                                <button onClick={onLogout} className="px-4 py-2 bg-purple-200 text-purple-800 hover:bg-purple-300 rounded-lg font-bold">Exit Admin</button>
                            </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-purple-100 p-6 mb-8">
                            <h2 className="text-xl font-bold text-purple-800 mb-4">Live Leaderboard ({players.length} Players)</h2>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left">
                                    <thead>
                                        <tr className="border-b-2 border-purple-100">
                                            <th className="p-3 text-purple-600 font-semibold">Rank</th>
                                            <th className="p-3 text-purple-600 font-semibold">Name</th>
                                            <th className="p-3 text-purple-600 font-semibold">Score</th>
                                            <th className="p-3 text-purple-600 font-semibold">Status</th>
                                            <th className="p-3 text-purple-600 font-semibold text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {sortedPlayers.map((p, i) => (
                                            <React.Fragment key={p.id}>
                                                <tr className="border-b border-purple-50 hover:bg-purple-50 transition-colors">
                                                    <td className="p-3 font-bold text-purple-900">#{i + 1}</td>
                                                    <td className="p-3 font-medium">{p.name}</td>
                                                    <td className="p-3">
                                                        <span className="bg-purple-100 text-purple-800 px-2 py-1 rounded-full text-sm font-bold">
                                                            {p.score}/{TOTAL_TO_WIN}
                                                        </span>
                                                    </td>
                                                    <td className="p-3">
                                                        {p.score === TOTAL_TO_WIN ? (
                                                            <span className="text-yellow-600 font-bold">Winner 🏆</span>
                                                        ) : (
                                                            <span className="text-gray-500">Playing</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3 text-right">
                                                        <button 
                                                            onClick={() => setExpandedPlayerId(expandedPlayerId === p.id ? null : p.id)}
                                                            className="text-sm bg-purple-100 hover:bg-purple-200 text-purple-700 px-3 py-1.5 rounded-md font-semibold transition-colors"
                                                        >
                                                            {expandedPlayerId === p.id ? 'Hide Answers' : 'View Answers'}
                                                        </button>
                                                    </td>
                                                </tr>
                                                {expandedPlayerId === p.id && (
                                                    <tr className="bg-purple-50/50">
                                                        <td colSpan="5" className="p-4 border-b border-purple-100">
                                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                                {CLUES.map((clue, idx) => (
                                                                    <div key={idx} className="bg-white p-3 rounded-lg border border-purple-100 shadow-sm">
                                                                        <div className="text-xs text-purple-400 font-bold mb-1">Box {(idx + 1).toString().padStart(2, '0')}</div>
                                                                        <div className="text-sm font-semibold text-gray-700 mb-2">{clue}</div>
                                                                        <div className="text-sm text-purple-900 bg-purple-50/50 p-2 rounded border border-purple-100 min-h-[36px] break-words">
                                                                            {p.inputs && p.inputs[idx] ? (
                                                                                <span className="font-medium">{p.inputs[idx]}</span>
                                                                            ) : (
                                                                                <span className="text-gray-400 italic">No answer yet</span>
                                                                            )}
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        ))}
                                        {players.length === 0 && (
                                            <tr><td colSpan="5" className="p-4 text-center text-gray-500">No players yet.</td></tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LobbyScreen = ({ players, currentUser }) => {
            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-100 via-white to-yellow-50 p-8 flex flex-col items-center justify-center">
                    <div className="max-w-3xl w-full bg-white rounded-3xl shadow-xl border border-purple-100 p-10 text-center">
                        <h1 className="text-5xl font-black text-purple-900 tracking-tight mb-4">
                            Welcome, {currentUser.name}!
                        </h1>
                        
                        <div className="mb-10 mt-8 flex flex-col items-center justify-center space-y-4">
                            <div className="w-12 h-12 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
                            <p className="text-2xl font-bold text-purple-700">Waiting for Admin to start the game...</p>
                            <p className="text-purple-500">Hang tight, the board will appear automatically!</p>
                        </div>

                        <div className="mb-4 mt-8">
                            <h2 className="text-lg font-bold text-gray-500 uppercase tracking-widest mb-4">Players in Lobby ({players.length})</h2>
                            <div className="flex flex-wrap gap-3 justify-center max-h-[300px] overflow-y-auto custom-scrollbar p-2">
                                {players.map(p => (
                                    <span key={p.id} className={`px-4 py-2 rounded-full text-lg font-medium shadow-sm border ${p.id === currentUser.id ? 'bg-purple-600 text-white border-purple-700' : 'bg-purple-50 text-purple-900 border-purple-200'}`}>
                                        {p.name} {p.id === currentUser.id && '(You)'}
                                    </span>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LoginScreen = ({ onJoin }) => {
            const [name, setName] = React.useState('');

            const handleSubmit = () => {
                if(name.trim()) onJoin(name.trim());
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-purple-100 via-white to-yellow-50">
                    <div className="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full border border-purple-100">
                        <div className="text-center mb-8">
                            <h1 className="text-5xl font-black text-purple-900 tracking-tight mb-2">
                                Human <span className="text-yellow-500 font-serif italic font-normal">Bingo</span>
                            </h1>
                            <p className="text-purple-600 font-medium">UCL Edition</p>
                        </div>
                        
                        <div className="bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded-xl mb-6 text-sm">
                            <strong>Note:</strong> This is running locally. Enter <code className="bg-yellow-200 px-1 rounded">ADMIN_UCL_2026</code> as your name to access the secret admin dashboard.
                        </div>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-purple-900 mb-1">Your Name</label>
                                <input
                                    type="text"
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    placeholder="Enter your name to play"
                                    className="w-full px-4 py-3 rounded-xl border-2 border-purple-100 focus:border-purple-500 focus:ring-4 focus:ring-purple-500/20 outline-none text-purple-900 font-medium transition-all"
                                    onKeyDown={(e) => e.key === 'Enter' && handleSubmit()}
                                    autoFocus
                                />
                            </div>
                            <button
                                onClick={handleSubmit}
                                disabled={!name.trim()}
                                className="w-full py-3.5 px-4 bg-purple-600 hover:bg-purple-700 text-white rounded-xl font-bold text-lg shadow-lg shadow-purple-600/30 disabled:opacity-50 disabled:cursor-not-allowed transition-all transform active:scale-[0.98]"
                            >
                                Join Game
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [globalGameStarted, setGlobalGameStarted] = React.useState(false);
            
            // State that holds the simulation of a database
            const [allPlayers, setAllPlayers] = React.useState([]);
            
            // Current player's active board state
            const [inputs, setInputs] = React.useState({});
            
            const [winner, setWinner] = React.useState(null);

            // Load data on mount and set up a basic polling to simulate real-time updates across tabs if needed
            React.useEffect(() => {
                const loadData = () => {
                    const loadedPlayers = getLocalPlayers();
                    setAllPlayers(loadedPlayers);
                    
                    const started = getGameState();
                    setGlobalGameStarted(started);
                    
                    // Check if anyone has won
                    const foundWinner = loadedPlayers.find(p => p.score >= TOTAL_TO_WIN);
                    if (foundWinner) {
                        setWinner(foundWinner);
                    }
                };

                loadData();
                const interval = setInterval(loadData, 2000); // Poll every 2 seconds to simulate live updates
                return () => clearInterval(interval);
            }, []);

            const toggleGameState = () => {
                const newState = !globalGameStarted;
                setGameState(newState);
                setGlobalGameStarted(newState);
            };

            const handleJoin = (name) => {
                if (name === ADMIN_CODE) {
                    setIsAdmin(true);
                    return;
                }

                let currentPlayers = getLocalPlayers();
                // Check if user exists locally (simulate login)
                let existingUser = currentPlayers.find(p => p.name.toLowerCase() === name.toLowerCase());
                
                if (!existingUser) {
                    existingUser = {
                        id: Date.now().toString(),
                        name: name,
                        score: 0,
                        inputs: {}
                    };
                    currentPlayers.push(existingUser);
                    saveLocalPlayers(currentPlayers);
                }

                setCurrentUser(existingUser);
                setInputs(existingUser.inputs || {});
                setAllPlayers(currentPlayers);
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setIsAdmin(false);
                setInputs({});
            };

            const handleClearAllData = () => {
                if(window.confirm("WARNING: This will delete all players and scores!")) {
                    localStorage.removeItem('bingo_players');
                    localStorage.removeItem('bingo_game_state');
                    setAllPlayers([]);
                    setWinner(null);
                    setGlobalGameStarted(false);
                }
            };

            const handleInputChange = (index, value) => {
                if (winner) return; // Game over
                
                const newInputs = { ...inputs, [index]: value };
                if (value.trim() === '') {
                    delete newInputs[index];
                }
                
                setInputs(newInputs);
                const currentScore = Object.keys(newInputs).length;

                // Save to local storage
                let currentPlayers = getLocalPlayers();
                const playerIndex = currentPlayers.findIndex(p => p.id === currentUser.id);
                if(playerIndex !== -1) {
                    currentPlayers[playerIndex].inputs = newInputs;
                    currentPlayers[playerIndex].score = currentScore;
                    saveLocalPlayers(currentPlayers);
                    setAllPlayers(currentPlayers);
                }

                if (currentScore >= TOTAL_TO_WIN && !winner) {
                     setWinner(currentPlayers[playerIndex]);
                }
            };

            const handleClearBoard = () => {
                if (!window.confirm("Are you sure you want to clear your board?")) return;
                setInputs({});
                
                let currentPlayers = getLocalPlayers();
                const playerIndex = currentPlayers.findIndex(p => p.id === currentUser.id);
                if(playerIndex !== -1) {
                    currentPlayers[playerIndex].inputs = {};
                    currentPlayers[playerIndex].score = 0;
                    saveLocalPlayers(currentPlayers);
                    setAllPlayers(currentPlayers);
                }
            };

            if (isAdmin) {
                return <AdminDashboard players={allPlayers} onLogout={handleLogout} onClearAll={handleClearAllData} gameStarted={globalGameStarted} toggleGameState={toggleGameState} />;
            }

            if (!currentUser) {
                return <LoginScreen onJoin={handleJoin} />;
            }

            if (!globalGameStarted && !winner) {
                return <LobbyScreen players={allPlayers} currentUser={currentUser} />;
            }

            const currentScore = Object.keys(inputs).length;
            const isGameOver = !!winner;

            return (
                <div className="min-h-screen bg-purple-50 text-slate-800 flex flex-col">
                    <header className="bg-white border-b border-purple-200 sticky top-0 z-10 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <div>
                                <h1 className="text-4xl font-black text-purple-900 tracking-tight">
                                    Human <span className="text-yellow-500 font-serif italic font-normal">Bingo</span>
                                </h1>
                                <p className="text-sm text-purple-600 mt-1 max-w-xl">
                                    Playing as <strong className="text-purple-800">{currentUser.name}</strong>. Find someone who fits a clue and enter their name.
                                </p>
                            </div>
                            
                            <div className="flex flex-col sm:flex-row items-center gap-4">
                                <button onClick={handleLogout} className="text-sm text-gray-500 hover:text-gray-800">Switch User</button>
                                <div className="bg-[#f0ece1] border border-[#e0dac7] px-6 py-2 rounded-2xl flex flex-col items-center">
                                    <span className="text-[10px] font-bold tracking-widest text-gray-500 uppercase">Names Found</span>
                                    <div className="text-3xl font-light text-gray-800">
                                        <span className="font-bold">{currentScore}</span><span className="text-xl text-gray-400">/{TOTAL_TO_WIN}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-6xl mx-auto px-4 py-8 w-full">
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-purple-100 mb-8">
                            <div className="flex justify-between items-end mb-6">
                                <div>
                                    <h2 className="text-[10px] font-bold tracking-widest text-gray-400 uppercase mb-1">The Challenge</h2>
                                    <h3 className="text-3xl font-serif text-purple-900">Find someone who...</h3>
                                </div>
                                <button 
                                    onClick={handleClearBoard}
                                    disabled={isGameOver}
                                    className="text-sm text-purple-600 border border-purple-200 hover:bg-purple-50 px-4 py-2 rounded-full transition-colors disabled:opacity-50"
                                >
                                    Clear board
                                </button>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3">
                                {CLUES.map((clue, idx) => (
                                    <BingoSquare
                                        key={idx}
                                        index={idx}
                                        clue={clue}
                                        value={inputs[idx]}
                                        onChange={handleInputChange}
                                        disabled={isGameOver}
                                    />
                                ))}
                            </div>
                        </div>
                    </main>

                    {/* Winner Overlay Modal */}
                    {isGameOver && (
                        <div className="fixed inset-0 bg-purple-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl shadow-2xl p-10 max-w-md w-full text-center border-4 border-yellow-400 animate-[bounce_0.5s_ease-out]">
                                <div className="text-6xl mb-4">🏆</div>
                                <h2 className="text-4xl font-black text-purple-900 mb-2">Congratulations!</h2>
                                <h3 className="text-2xl font-bold text-purple-700 mb-4">BINGO!</h3>
                                <p className="text-xl text-gray-600 mb-8">
                                    {winner.id === currentUser?.id ? (
                                        <span><span className="font-bold text-purple-700">You</span> have filled all the boxes and won the game!</span>
                                    ) : (
                                        <span><span className="font-bold text-purple-700">{winner.name}</span> has filled all the boxes and won the game!</span>
                                    )}
                                </p>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="w-full py-3 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold rounded-xl transition-colors"
                                >
                                    Close & Refresh
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
